unique_name: Employee
object_type: dimension
label: Employee
description: "Employee / staff dimension with salesperson flag and preferred name. Role-played as Order Salesperson, Order Picker, and Sale Salesperson."
type: standard

hierarchies:

  - unique_name: Employee
    label: Employee
    folder: Employees
    description: "Single-level grouping by employee; carries salesperson flag and preferred name attributes."
    filter_empty: "yes"

    levels:

      - unique_name: Employee

        secondary_attributes:

          - unique_name: Is Salesperson
            label: Is Salesperson
            description: "Whether the employee is a salesperson (true/false). Distinguishes salespeople from pickers and other staff."
            folder: Employees
            dataset: dimension-employee
            name_column: is_salesperson
            key_columns:
              - is_salesperson
            sort_column: is_salesperson

          - unique_name: Preferred Name
            label: Preferred Name
            description: "Name the employee prefers to be addressed by (nickname / short name)."
            folder: Employees
            dataset: dimension-employee
            name_column: preferred_name
            key_columns:
              - preferred_name
            sort_column: preferred_name

level_attributes:

  - unique_name: Employee
    label: Employee
    is_unique_key: true
    description: "Employee full name (salespeople and warehouse pickers). Role-played as Order Salesperson, Order Picker, and Sale Salesperson."
    dataset: dimension-employee
    name_column: employee
    key_columns:
      - employee_key
