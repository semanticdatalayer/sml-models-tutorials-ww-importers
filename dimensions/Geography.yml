unique_name: Geography
object_type: dimension
label: Geography
description: City Dimension
type: standard

hierarchies:

  - unique_name: City-State-Country Hierarchy
    label: City-State-Country Hierarchy
    description: "Geographic rollup Continent > Country > State Province > City. Role-played per geography role (Sale, Order). Contrast City-Region Hiearchy (region-based rollup)."
    folder: Location
    filter_empty: "yes"

    levels:

      - unique_name: Continent

      - unique_name: Country

      - unique_name: State Province

      - unique_name: City-State

  - unique_name: City-Region Hiearchy
    label: 'City-Region Hiearchy '
    description: "Geographic rollup Region > Sub Region > City (e.g. Americas > Northern America). Contrast City-State-Country Hierarchy (political rollup)."
    folder: Location
    filter_empty: "yes"

    levels:

      - unique_name: Region

      - unique_name: Sub Region

      - unique_name: City-Region

level_attributes:

  - unique_name: City-Region
    label: City
    description: "City at the leaf of the City-Region Hiearchy. Same cities as the City-State level, reached via Region > Sub Region."
    dataset: city
    name_column: city
    key_columns:
      - city_key

  - unique_name: City-State
    label: City
    description: City Dimension
    is_unique_key: true
    dataset: city
    name_column: city
    key_columns:
      - city_key

  - unique_name: Continent
    label: Continent
    description: "Continent (e.g. North America, Europe). Top of the City-State-Country Hierarchy."
    dataset: city
    name_column: continent
    key_columns:
      - continent

  - unique_name: Country
    label: Country
    description: "Country / nation (e.g. United States). Within the City-State-Country Hierarchy."
    dataset: city
    name_column: country
    key_columns:
      - country

  - unique_name: Region
    label: Region
    description: "World region (e.g. Americas). Top of the City-Region Hiearchy; contrast Continent."
    dataset: city
    name_column: region
    key_columns:
      - region

  - unique_name: State Province
    label: State Province
    description: "State / province (e.g. California). Between Country and City in the City-State-Country Hierarchy."
    dataset: city
    name_column: state_province
    key_columns:
      - state_province

  - unique_name: Sub Region
    label: Sub Region
    description: "World subregion (e.g. Northern America). Between Region and City in the City-Region Hiearchy."
    dataset: city
    name_column: subregion
    key_columns:
      - subregion
