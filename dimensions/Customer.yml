unique_name: Customer
object_type: dimension
label: Customer
description: "Customer / buyer dimension: customer name with category, postal code, and primary contact attributes. Role-played as Sale, Order, Movement, Transaction, and Bill-to customer; contrast Supplier."
type: standard

hierarchies:

  - unique_name: Customer
    label: Customer
    folder: Customers
    description: "Single-level grouping by customer name; carries category, postal code, and primary contact attributes."
    filter_empty: "yes"

    levels:

      - unique_name: Customer

        secondary_attributes:

          - unique_name: Customer Category
            label: Customer Category
            description: "Customer category / segment (e.g. Novelty Shop, Supermarket). Groups customers; contrast Supplier Category."
            folder: Customers
            dataset: dimension-customer
            name_column: category
            key_columns:
              - category
            sort_column: category

          - unique_name: Customer Postal Code
            label: Customer Postal Code
            description: "Customer zip / postal code. Customer location; contrast Supplier Postal Code."
            folder: Customers
            dataset: dimension-customer
            name_column: postal_code
            key_columns:
              - postal_code
            sort_column: postal_code

          - unique_name: Customer Primary Contact
            label: Customer Primary Contact
            description: "Primary contact person for the customer. Contrast Supplier Primary Contact."
            folder: Customers
            dataset: dimension-customer
            name_column: primary_contact
            key_columns:
              - primary_contact
            sort_column: primary_contact

level_attributes:

  - unique_name: Customer
    label: Customer Name
    description: "Customer / account / buyer name (e.g. Tailspin Toys). Role-played as Sale, Order, Movement, Transaction, and Bill-to customer; contrast Supplier."
    is_unique_key: true
    dataset: dimension-customer
    name_column: customer
    key_columns:
      - customer_key
